name: Bug report
description: Report a reproducible library defect
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Never include live OAuth credentials, token files, or unredacted authenticated requests.
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include synthetic inputs, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js, SDK, operating system, and package-manager versions.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed all credentials and private account or workspace data.
          required: true
