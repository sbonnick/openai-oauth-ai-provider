name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Verify release version
        run: |
          package_version="$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; process.stdout.write(manifest.version)")"
          lock_version="$(node --input-type=module -e "import lock from './package-lock.json' with { type: 'json' }; process.stdout.write(lock.version)")"
          test "$GITHUB_REF_NAME" = "v$package_version"
          test "$lock_version" = "$package_version"

      - name: Check and build
        run: npm run check

      - name: Create release artifact
        run: |
          mkdir release
          npm pack --pack-destination release

      - name: Checksum release artifact
        working-directory: release
        run: sha256sum ./*.tgz > SHA256SUMS

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - name: Verify release artifact
        run: sha256sum --check SHA256SUMS

      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.5.1

      - name: Publish to npm
        run: npm publish ./*.tgz --access public --provenance
